  <section id="como-trabajo">
    <h2>Cómo trabajo</h2>
    <p>Dega es el nombre de VJ de Pablo Gaitán, un diseñador audiovisual capaz de crear un universo visual que abarca visuales en vivo, videoclips y otros tipos de piezas publicitarias. El trabaja cada proyecto en cuatro simples pasos: escuchar, proponer, diseñar y operar.</p>
    <p>Descubrió los visuales en vivo experimentando con GLMixer y en 2024 ganó la Batalla de los DJs como mejor mezcla VJ en vivo, lo que lo llevó a realizar el show de visuales de Juliana Quédate Otro Día en el Festival Estéreo Picnic, con quienes posteriormente realizó el videoclip de &quot;La Culpa&quot; el cual está nominado a &quot;Mejor Videoclip Nacional&quot; en Bogoshorts</p>
    <ol>
      <li><strong>Escuchar.</strong> La parte más esencial de todo el proceso, conocer tu música, conectar con ella, y a partir de ello empezar a desglosarla, entender que querías contar con esa obra, por qué querías contarla, y empezar a indagar en todas esas imágenes que se van creando dentro de mi cabeza cuando escucho o pienso en esa canción.

Luego me reúno contigo y me adentro en ese universo que tienes dentro de tu cabeza, te pregunto como ves tu esa canción, como te la imaginas que se ve y busco entenderla desde tu perspectiva para saber que quieres transmitirle al público. </li>
      <li><strong>Proponer.</strong> Acá yo empiezo a maquinar dentro de mi cabeza como darle forma a aquellas ideas sueltas que compartimos en la reunión y la vuelvo una propuesta visual, te doy un look para esa canción y te ejemplifico todo: la paleta de colores, la textura, mis referentes. Preparo todos los elementos para que tu te hagas una idea de como va a ser todo ese universo visual que va a darle vida visualmente a tu obra

Si gusta se queda, si no, hay dos rondas más gratuitas para poder seguir proponiendo y seguir dandole forma a todo.</li>
      <li><strong>Diseñar.</strong> Este es el momento donde ocurre la verdadera acción. Acá la idea se vuelve tangible, todo lo propuesto comienza a cobrar vida, y tu, vas a ver cada uno de esos procesos, y vas a ser parte de ellos y poder ver con tus propios ojos como se crea la imagen, como se le da una nueva vida a tu música.

Cuando se acaba el proceso de diseño y esa obra ya está viva y es tangible, hay dos rondas de cambios gratuitas para poder ajustarla más a la visión que tienes tu de la imagen.<ul><li>Software: Resolume Arena, TouchDesigner, After Effects, Premiere, Blender</li><li>Equipo: Computador, dos cámaras, HDMI inalámbrico y dos controladores MIDI</li><li>Operación: En vivo</li><li>Ciudades: Pereira, Bogotá y Cali</li></ul></li>
      <li><strong>Operar.</strong> Este último paso es el que más se disfruta, el día tan esperado. El videoclip se estrena, las visuales aparecen en tu show; Y aquel espectador que tanto amaba esa canción que hiciste, podrá verla, disfrutarla y ahondar más en aquello que generaba esa canción dentro de sí, haciendo que tenga un valor más grande para el poder ver aquello que tanto ama escuchar.</li>
      <li><strong>Demo para tu canción.</strong> Qué esperas a poder vivir esto, envíame una canción y te hago una demo visual, para que veas el resultado antes de decidir.</li>
    </ol>
  </section>

  <section id="sobre-mi">
    <h2>Sobre mí</h2>
    <p>Soy Pablo Gaitán alias &quot;DEGA&quot;, soy un VJ y diseñador audiovisual bogotano. Descubrí los visuales en vivo gracias a una profesora que me puso a experimentar con GLMixer y me animó a competir en la Batalla de los DJs, donde gané a mejor mezcla VJ en vivo.</p>
    <p>Después pasé por videoclips, cortometrajes y videoensayos, y volví al escenario en el Festival Estéreo Picnic 2025 con Juliana Quédate Otro Día, lo cual me permitió tener una conexión sólida con ellos y empezar a crear un universo visual narrativo que terminó concluyendo en el videoclip de &quot;La Culpa&quot; el cual está nominado a &quot;Mejor Videoclip Nacional&quot; en Bogoshorts. Hoy combino After Effects, Resolume y TouchDesigner para que los visuales y los videoclips no sean un acompañamiento, sino un universo propio que el público recuerde.</p>
    <ul>
      <li><strong>Premios:</strong> Ganador, Batalla de los DJs, mejor mezcla VJ en vivo, 2024; Nominado, 24.ª edición del festival Bogoshorts, «La Culpa»</li>
      <li><strong>Estudios:</strong> Diseño Audiovisual, UCP, 8.º semestre; Diplomado UNISARC 2023; Domestika 2026</li>
      <li><strong>Colectivos y proyectos:</strong> Cara de Pez Lab (productora); Solsticio (colectivo)</li>
      <li><strong>Shows destacados:</strong> FEP con Juliana Quédate Otro Día; Batalla de los DJs 2024; La Culpa - Juliana Quédate Otro Día</li>
      <li><strong>Software instalado:</strong> Resolume Arena · TouchDesigner · After Effects · Premiere · Blender</li>
      <li><strong>Ciudades:</strong> Pereira, Bogotá y Cali</li>
    </ul>

  <section id="hoja-de-vida">
    <h2>Hoja de vida</h2>
    <p><strong>Pablo Gaitán</strong>, Productor Audiovisual. <a href="assets/hoja-de-vida.pdf">Descargar PDF</a></p>
    <p>Estudiante de octavo semestre de Diseño Audiovisual en la Universidad Católica de Pereira, con experiencia en ingeniería de pantallas en eventos en vivo y desarrollo de proyectos creativos. He trabajado como operador de visuales, sonido, cámaras y montaje técnico, participando en eventos institucionales, corporativos y musicales.</p>
    <p>Me caracterizo por ser una persona creativa, analítica y resolutiva, capaz de responder de manera eficiente en escenarios de alta presión, así mismo disfruto de encontrar soluciones innovadoras ante los desafíos técnicos y creativos, aportando así ideas que fortalezcan cada producción, combinando una visión artística con un enfoque práctico y organizado.</p>
    <h3>Educación</h3>
    <ul><li><strong>Tecnología en Producción de Imagen y Sonido | En Curso.</strong> Universidad Católica de Pereira | 2025-1 a 2025-2</li><li><strong>Técnica Profesional en Vídeo, Disc-Jockey y Sonido | Finalizado.</strong> Universidad Católica de Pereira | 2023-1 a 2024-2</li><li><strong>Diplomado en cinematografía con enfoque en lo rural | Finalizado.</strong> Unisarc - Smoke Films | 2023</li><li><strong>Profesional en Diseño Audiovisual | En Curso.</strong> Universidad Católica de Pereira | 2026-1 a Actualidad</li></ul>
    <h3>Experiencia</h3>
    <p><strong>Altura Soluciones | Producción Audiovisual para Eventos (1 año y medio)</strong></p><ul><li>Operación de pantallas LED y sistemas de visuales para eventos corporativos y musicales.</li><li>Montaje y configuración de equipos audiovisuales.</li><li>Participación en eventos para la Secretaría de Deporte de Pereira y el partido MIRA.</li><li>Operación de cámaras para transmisiones y registro audiovisual.</li></ul>
    <p><strong>Juliana Quédate Otro Día | Producción Audiovisual (2 años)</strong></p><ul><li>Desarrollo del show visual para el Festival Estéreo Picnic y el lanzamiento de su segundo álbum.</li><li>Planeación de conceptos visuales para conciertos, videoclips y lanzamientos musicales.</li><li>Escritura, dirección y producción del videoclip &quot;La Culpa&quot;, el cual fue nominado a mejor videoclip en Bogoshorts.</li></ul>

    <p><strong>Postproducción audiovisual, Imagen y Audio | 4 años</strong></p><ul><li>Dominio de software de edición: Adobe Premiere, After Effects y DaVinci Resolve.</li><li>Bajo el ámbito de audio, Adobe Audition y Reaper.</li><li>Bajo el ámbito de eventos en vivo, Arena Resolume 7, Touch Designer y OBS.</li></ul>
    <p><strong>Departamento creativo y dirección | 3 años</strong></p><ul><li><strong>Diseño y ejecución de eventos en vivo:</strong> un abanico amplio que abarca desde el montaje de eventos, pasando por la ingeniería de pantallas, y la ejecución y realización de visuales en eventos en vivo.</li><li><strong>Construcción de referencias visuales:</strong> experiencia sólida en la creación de moodboards, integrando referentes visuales provenientes del cine, la música, la moda, la fotografía, el arte contemporáneo y la cultura audiovisual.</li><li><strong>Escritura, Dirección y Producción Audiovisual:</strong> escritura, planificación y organización detallada de los procesos de preproducción, producción y postproducción en obras audiovisuales, ofreciendo un amplio conocimiento de los procesos de realización audiovisual y de sus distintas maneras de funcionar.</li></ul>
